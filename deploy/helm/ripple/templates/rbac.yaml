{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ripple.fullname" . }}
  labels:
    {{- include "ripple.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "replicationcontrollers"]
    verbs: ["get", "list"]
  {{- if .Values.scanSecrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ripple.fullname" . }}
  labels:
    {{- include "ripple.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ripple.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ripple.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
