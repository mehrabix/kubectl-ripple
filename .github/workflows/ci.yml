name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed for:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -race -cover
      - name: build
        run: go build ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: ripple-ci
      - name: build
        run: go build -o bin/kubectl-ripple ./cmd/kubectl-ripple
      - name: end-to-end
        run: BIN=$PWD/bin/kubectl-ripple ./test/e2e/run.sh

  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: lint the chart
        run: helm lint deploy/helm/ripple
      - name: render the chart
        run: helm template ripple deploy/helm/ripple >/dev/null
