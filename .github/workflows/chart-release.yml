name: chart-release

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish the chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: lint
        run: helm lint deploy/helm/ripple
      - name: package
        run: helm package deploy/helm/ripple --destination .chart-packages
      - name: publish to the gh-pages chart repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Set these two repository variables to get the "Verified publisher"
          # badge on Artifact Hub. The email must match the one used to sign in.
          AH_REPO_ID: ${{ vars.ARTIFACTHUB_REPO_ID }}
          AH_EMAIL: ${{ vars.ARTIFACTHUB_EMAIL }}
        run: |
          set -euo pipefail
          chart_file="$(basename "$(ls .chart-packages/*.tgz | head -1)")"
          pages="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${OWNER}/${REPO}.git" "$pages"
          cp .chart-packages/*.tgz "$pages/"

          # Ownership proof for Artifact Hub: must sit next to index.yaml.
          # repositoryID alone is enough for the "Verified publisher" badge;
          # the owners block is only needed to claim an existing repository.
          if [ -n "${AH_REPO_ID}" ]; then
            {
              echo "repositoryID: ${AH_REPO_ID}"
              if [ -n "${AH_EMAIL}" ]; then
                echo "owners:"
                echo "  - name: ${OWNER}"
                echo "    email: ${AH_EMAIL}"
              fi
            } > "$pages/artifacthub-repo.yml"
          fi

          helm repo index "$pages" --url "https://${OWNER}.github.io/${REPO}"
          cd "$pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "chart repository already up to date"
            exit 0
          fi
          git commit -m "chore: publish helm chart ${chart_file}"
          git push origin HEAD:gh-pages
