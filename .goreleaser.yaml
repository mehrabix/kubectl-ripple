version: 2

project_name: kubectl-ripple

before:
  hooks:
    - go mod tidy

builds:
  - id: ripple
    main: ./cmd/kubectl-ripple
    binary: kubectl-ripple
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mehrabix/kubectl-ripple/internal/cli.Version={{.Version}}
      - -X github.com/mehrabix/kubectl-ripple/internal/cli.Commit={{.Commit}}
      - -X github.com/mehrabix/kubectl-ripple/internal/cli.BuildDate={{.Date}}

archives:
  - id: ripple
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    kubectl krew install ripple
    ```

    Or grab the archive for your platform above.
